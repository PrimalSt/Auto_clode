[project]
name = "autogenerator-contracts"
version = "0.1.0"
description = "Контракты: модели данных, интерфейсы плагинов, коды ошибок. Без логики обработки."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyarrow>=17",
    "ruamel.yaml>=0.18",
    "lxml>=5",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.contracts"
