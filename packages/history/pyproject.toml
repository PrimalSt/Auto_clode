[project]
name = "autogenerator-history"
version = "0.1.0"
description = "История выгрузок: периоды загрузок, правила пересечения, действующая история."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "polars>=1.30",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.history"
