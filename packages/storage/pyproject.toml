[project]
name = "autogenerator-storage"
version = "0.1.0"
description = "Хранилища: папка данных, метаданные в SQLite, файлы загрузок."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.storage"
