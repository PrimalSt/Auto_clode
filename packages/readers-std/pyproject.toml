[project]
name = "autogenerator-readers-std"
version = "0.1.0"
description = "Встроенные читатели файлов: CSV и Excel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "pyarrow>=17",
    "fastexcel>=0.14",
]

[project.entry-points."autogenerator.readers"]
csv = "autogenerator.readers_std.csv_reader:CsvReader"
xlsx = "autogenerator.readers_std.excel_reader:ExcelReader"
xls = "autogenerator.readers_std.xls_reader:XlsReader"
xlsb = "autogenerator.readers_std.xlsb_reader:XlsbReader"

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.readers_std"
