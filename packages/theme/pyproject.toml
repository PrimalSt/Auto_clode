[project]
name = "autogenerator-theme"
version = "0.1.0"
description = "Импорт .pptx-шаблона: макеты, роли, слайды шаблона, манифест."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "python-pptx>=1.0.2",
    "lxml>=5",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.theme"
