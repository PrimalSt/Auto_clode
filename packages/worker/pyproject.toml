[project]
name = "autogenerator-worker"
version = "0.1.0"
description = "Код исполнителя: собирает модули обработки в одно задание."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "autogenerator-plugin-host",
    "autogenerator-ingest",
    "autogenerator-schema",
    "autogenerator-history",
    "autogenerator-engine",
    "autogenerator-theme",
    "autogenerator-render",
    "autogenerator-readers-std",
    "autogenerator-steps-std",
    "autogenerator-blocks-std",
    "polars>=1.30",
    "pyarrow>=17",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.worker"
