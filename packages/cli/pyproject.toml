[project]
name = "autogenerator-cli"
version = "0.1.0"
description = "Команда agen."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "autogenerator-api",
    "typer>=0.15",
]

[project.scripts]
agen = "autogenerator.cli.main:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.cli"
