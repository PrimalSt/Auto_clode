[project]
name = "autogenerator-render"
version = "0.1.0"
description = "Сборка презентации в рабочей копии шаблона."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "autogenerator-plugin-host",
    "python-pptx>=1.0.2",
    "lxml>=5",
    "pyarrow>=17",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "autogenerator.render"
