# Ежемесячный отчёт по продажам — пример сценария (этапы M0–M3).
# Запуск из корня репозитория:  uv run agen run examples/sales/scenario.yaml
# Превью любого узла:           uv run agen preview examples/sales/scenario.yaml dataset:plan_fact
# Слайды — из макетов шаблона (layout) и готовые слайды шаблона (example): у них метки {{…}}
# получают значения, графики и таблица — данные. Что есть в шаблоне: uv run agen theme check
# examples/templates/synthetic.pptx
# Выгрузки берутся из data/<вход>/ по порядку имён; отчётный период по умолчанию —
# последний месяц основного входа (март 2026).

spec_version: 1
name: Ежемесячный отчёт по продажам
theme: ../templates/synthetic.pptx
output_name: "Отчёт_продажи_{period}"

inputs:
  - id: sales
    source: sales_crm
    main: true
    pipeline:
      - { id: dedupe_orders, type: dedupe, by: [order_no], keep: last }
      - { id: positive_only, type: filter, where: "amount > 0" }
      - { id: net_of_vat, type: formula, column: amount_net, expr: "amount / 1.2" }
  - id: plan
    source: sales_plan

datasets:
  - id: by_month
    label: Выручка по месяцам квартала
    input: sales
    window: quarter_to_date
    group_by: [{ column: date, bucket: month }]
    aggregate:
      - { column: amount_net, fn: sum, as: revenue }
      - { fn: count, as: orders }

  - id: by_region
    label: Регионы за месяц
    input: sales
    window: report_period
    group_by: [region]
    aggregate:
      - { column: amount_net, fn: sum, as: revenue }
      - { fn: count, as: orders }
      - { column: amount_net, fn: mean, as: avg_check }
    compare: [previous_period]          # revenue_prev, revenue_prev_change, revenue_prev_change_pct
    derive: [{ fn: share, column: revenue, as: share }]
    sort: [-revenue]

  - id: top_managers
    label: Лучшие менеджеры месяца
    input: sales
    window: report_period
    group_by: [manager]
    aggregate: [{ column: amount_net, fn: sum, as: revenue }]
    sort: [-revenue]
    top: 5

  # План-факт: запрос SQL к двум входам; окно применяется к каждому входу до запроса.
  - id: plan_fact
    label: План-факт по регионам за месяц
    window: report_period
    query: |
      WITH fact AS (SELECT region, sum(amount_net) AS fact FROM sales GROUP BY region),
           goal AS (SELECT region, sum(plan_amount) AS plan FROM plan GROUP BY region)
      SELECT region, fact, plan, fact / plan AS done
      FROM goal LEFT JOIN fact USING (region)
      ORDER BY done DESC

  # Крупные (от 100 тыс. ₽) и остальные заказы по месяцам: столбцы с накоплением и доля линией.
  - id: month_mix
    label: Крупные и остальные заказы по месяцам квартала
    window: quarter_to_date
    query: |
      SELECT date_trunc('month', date) AS month,
             sum(CASE WHEN amount_net >= 100000 THEN amount_net ELSE 0 END) AS big,
             sum(CASE WHEN amount_net < 100000 THEN amount_net ELSE 0 END) AS small,
             sum(CASE WHEN amount_net >= 100000 THEN amount_net ELSE 0 END) / sum(amount_net) AS big_share
      FROM sales
      GROUP BY 1
      ORDER BY 1

  # Динамика: месяцы квартала становятся столбцами сводной таблицы.
  - id: region_months
    label: Выручка регионов по месяцам квартала
    input: sales
    window: quarter_to_date
    group_by: [region, { column: date, bucket: month }]
    aggregate: [{ column: amount_net, fn: sum, as: revenue }]
    sort: [region]
    pivot: date

metrics:
  # compare добавляет revenue_prev, revenue_prev_change и revenue_prev_change_pct.
  - { id: revenue, input: sales, window: report_period, column: amount_net, fn: sum, compare: [previous_period] }
  - { id: revenue_qtd,  input: sales, window: quarter_to_date, column: amount_net,  fn: sum }
  - { id: orders,       input: sales, window: report_period,   fn: count }
  - { id: plan,         input: plan,  window: report_period,   column: plan_amount, fn: sum }
  - { id: plan_qtd,     input: plan,  window: quarter_to_date, column: plan_amount, fn: sum }
  - { id: plan_done,     formula: "revenue / plan" }
  - { id: plan_done_qtd, formula: "revenue_qtd / plan_qtd" }
  - { id: median_order, input: sales, window: report_period, column: amount_net, fn: median }
  - id: big_orders
    window: report_period
    query: "SELECT count(*) FROM sales WHERE amount_net >= 100000"
  - id: top_region_share
    window: report_period
    query: "SELECT max(r) / sum(r) FROM (SELECT sum(amount_net) AS r FROM sales GROUP BY region)"

# Метки слайдов шаблона на всю презентацию; слайд может привязать метку по-своему.
markers:
  Месяц: period.month          # «март»
  Год: period.year

slides:
  # Обложка — слайд шаблона с id 256: «{{Месяц}} {{Год}}».
  - example: 256
    markers:
      Месяц: period.Month        # с заглавной буквы: «Март»

  # Итоги — слайд шаблона 257: три метки и комбинированный график (2 серии столбцами,
  # линия на второй оси).
  - example: 257
    markers:
      Выручка: { metric: revenue, scale: million, decimals: 1 }      # «{{Выручка}} млн ₽»
      # «%» уже в шаблоне после метки, поэтому значение подставляется без своего «%». В отчёте
      # за первый месяц истории прошлого месяца нет: метка остаётся пустой, а не останавливает сборку.
      Прирост+: { metric: revenue_prev_change_pct, percent: true, sign: true, empty: blank }
      Доля: { metric: plan_done, percent: true, decimals: 0 }       # «{{Доля}}% плана выполнено»
    blocks:
      - type: chart_fill
        shape: 6                    # id графика на слайде шаблона
        dataset: month_mix
        categories: month
        series:
          - { column: big, name: "Крупные заказы", scale: million }
          - { column: small, name: "Остальные", scale: million }
          - { column: big_share, name: "Доля крупных", number_format: "0%" }

  - layout: title_and_content
    blocks:
      - { type: text, slot: title, text: "Заказы: {{ period.label }}" }
      - type: text
        slot: body
        text: |-
          Заказов: {{ metrics.orders | number }}, из них от 100 тыс. ₽: {{ metrics.big_orders | number }}
          Медианный заказ: {{ metrics.median_order | money }}

  - layout: title_and_content
    blocks:
      - { type: text, slot: title, text: "Динамика: {{ period.quarter_label }}" }
      - type: chart
        slot: body
        chart: column
        dataset: by_month
        x: date
        series: [{ column: revenue, name: "Выручка без НДС, млн ₽" }]
        number_format: "#,##0.0,,"   # ",," — в миллионах
        data_labels: true

  # Регионы — слайд шаблона 258: круговая диаграмма и доля первого региона. Метка {{Доля}}
  # есть и на слайде 257, но здесь значит другое: привязка на уровне слайда.
  - example: 258
    markers:
      Доля: { metric: top_region_share, percent: true, decimals: 0 }
    blocks:
      - { type: chart_fill, shape: 4, dataset: by_region, categories: region, series: [{ column: revenue, name: Выручка }] }

  - layout: title_and_two_content
    blocks:
      - { type: text, slot: title, text: "Регионы: {{ period.label }}" }
      - type: table
        slot: left
        dataset: by_region
        columns:
          - { column: region, header: Регион }
          - { column: revenue, header: "Выручка, млн ₽", format: { kind: number, scale: million, decimals: 1 } }
          - { column: revenue_prev_change_pct, header: К прошлому месяцу, format: { kind: percent, sign: true } }
          - { column: share, header: Доля, format: { kind: percent } }
          - { column: avg_check, header: "Средний чек, ₽", format: { kind: number, decimals: 0 } }
      - type: chart
        slot: right
        chart: bar
        dataset: by_region
        x: region
        series: [{ column: revenue, name: "Выручка без НДС, млн ₽" }]
        number_format: "#,##0.0,,"
        data_labels: true

  - layout: title_and_content
    blocks:
      - type: text
        slot: title
        font_size: 32
        text: >-
          {{ period.quarter_label }}: {{ metrics.revenue_qtd | money(scale='million', decimals=1) }},
          план {{ metrics.plan_done_qtd | percent }}
      - type: table
        slot: body
        dataset: by_month
        columns:
          - { column: date, header: Месяц }
          - { column: revenue, header: "Выручка без НДС, ₽" }
          - { column: orders, header: Заказов }

  - layout: title_only
    blocks:
      - { type: text, slot: title, text: "Лучшие менеджеры: {{ period.label }}" }
      - type: chart
        slot: body
        chart: bar
        dataset: top_managers
        x: manager
        series: [{ column: revenue, name: "Выручка без НДС, млн ₽" }]
        number_format: "#,##0.00,,"
        data_labels: true

  - layout: title_and_content
    blocks:
      - { type: text, slot: title, text: "План-факт: {{ period.label }}" }
      - type: table
        slot: body
        dataset: plan_fact
        columns:
          - { column: region, header: Регион }
          - { column: fact, header: "Факт без НДС, млн ₽", format: { kind: number, scale: million, decimals: 1 } }
          - { column: plan, header: "План, млн ₽", format: { kind: number, scale: million, decimals: 1 } }
          - { column: done, header: Выполнение, format: { kind: percent } }

  # Таблица шаблона (слайд 261): регионы и месяцы квартала из сводной таблицы; столбцы месяцев
  # добавляются сами, их заголовки — «янв. 2026», ….
  - example: 261
    blocks:
      - type: table_fill
        shape: 3
        dataset: region_months
        columns: [{ column: region, header: Регион }]
        other_columns: true
        number: { scale: million, decimals: 1 }

  - example: 263                  # «Спасибо!»
