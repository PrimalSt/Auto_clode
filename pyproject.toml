# Корень uv workspace. Сам корень — виртуальный проект: он не собирается в пакет,
# а только перечисляет модули, чтобы `uv sync` поставил их все в одно окружение.
[project]
name = "autogenerator-workspace"
version = "0.1.0"
description = "Autogenerator: автогенератор отчётных презентаций (монорепозиторий модулей)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "autogenerator-contracts",
    "autogenerator-plugin-host",
    "autogenerator-readers-std",
    "autogenerator-ingest",
    "autogenerator-schema",
    "autogenerator-history",
    "autogenerator-storage",
    "autogenerator-steps-std",
    "autogenerator-engine",
    "autogenerator-theme",
    "autogenerator-blocks-std",
    "autogenerator-render",
    "autogenerator-worker",
    "autogenerator-api",
    "autogenerator-cli",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
    "mypy>=1.18",
    "import-linter>=2.5",
    # Тесты читателей и tools/make_examples.py пишут .xlsx.
    "xlsxwriter>=3.2",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
autogenerator-contracts = { workspace = true }
autogenerator-plugin-host = { workspace = true }
autogenerator-readers-std = { workspace = true }
autogenerator-ingest = { workspace = true }
autogenerator-schema = { workspace = true }
autogenerator-history = { workspace = true }
autogenerator-storage = { workspace = true }
autogenerator-steps-std = { workspace = true }
autogenerator-engine = { workspace = true }
autogenerator-theme = { workspace = true }
autogenerator-blocks-std = { workspace = true }
autogenerator-render = { workspace = true }
autogenerator-worker = { workspace = true }
autogenerator-api = { workspace = true }
autogenerator-cli = { workspace = true }

# --- Проверки ---------------------------------------------------------------

[tool.pytest.ini_options]
# У пакетов одинаковые имена тестовых файлов; importlib-режим не даёт им конфликтовать.
addopts = "--import-mode=importlib -q"
testpaths = ["packages"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Документы (PRD.md, ARCHITECTURE.md) не форматируются: примеры кода в них выровнены вручную.
extend-exclude = ["examples", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001–RUF003 ругаются на кириллицу в строках и комментариях («с» похожа на латинскую «c»).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["autogenerator"]

[tool.mypy]
python_version = "3.12"
# Проверяется код модулей (packages/*/src) и tools/; тесты — только pytest.
files = ["packages/*/src", "tools"]
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
mypy_path = [
    "packages/contracts/src",
    "packages/plugin_host/src",
    "packages/readers-std/src",
    "packages/ingest/src",
    "packages/schema/src",
    "packages/history/src",
    "packages/storage/src",
    "packages/steps-std/src",
    "packages/engine/src",
    "packages/theme/src",
    "packages/blocks-std/src",
    "packages/render/src",
    "packages/worker/src",
    "packages/api/src",
    "packages/cli/src",
    "tools",
]

[[tool.mypy.overrides]]
module = ["fastexcel.*", "babel.*", "pyarrow.*", "ruamel.*", "xlsxwriter.*", "lxml.*"]
ignore_missing_imports = true

# --- Границы модулей (ARCHITECTURE.md, раздел 4.2) ---------------------------
# Проверяются командой `uv run lint-imports` и в CI.

[tool.importlinter]
root_packages = [
    "autogenerator.contracts",
    "autogenerator.storage",
    "autogenerator.plugin_host",
    "autogenerator.readers_std",
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.steps_std",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.blocks_std",
    "autogenerator.render",
    "autogenerator.worker",
    "autogenerator.api",
    "autogenerator.cli",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Правило 1: модули обработки не знают друг о друге"
type = "independence"
modules = [
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.render",
]

[[tool.importlinter.contracts]]
name = "Правило 1: модули обработки не зависят от сборщиков (worker, api, cli)"
type = "forbidden"
source_modules = [
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.render",
]
forbidden_modules = [
    "autogenerator.worker",
    "autogenerator.api",
    "autogenerator.cli",
]

[[tool.importlinter.contracts]]
name = "Правило 3: плагины зависят только от контрактов"
type = "forbidden"
source_modules = [
    "autogenerator.readers_std",
    "autogenerator.steps_std",
    "autogenerator.blocks_std",
]
forbidden_modules = [
    "autogenerator.plugin_host",
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.render",
    "autogenerator.worker",
    "autogenerator.api",
    "autogenerator.cli",
]

[[tool.importlinter.contracts]]
name = "Правило 3: встроенные плагины не зависят друг от друга"
type = "independence"
modules = [
    "autogenerator.readers_std",
    "autogenerator.steps_std",
    "autogenerator.blocks_std",
]

[[tool.importlinter.contracts]]
name = "Правило 3: хозяева берут плагины только из реестра, а не импортом"
type = "forbidden"
source_modules = [
    "autogenerator.ingest",
    "autogenerator.engine",
    "autogenerator.render",
    "autogenerator.worker",
    "autogenerator.api",
    "autogenerator.cli",
]
forbidden_modules = [
    "autogenerator.readers_std",
    "autogenerator.steps_std",
    "autogenerator.blocks_std",
]

[[tool.importlinter.contracts]]
name = "Правило 8: модули обработки и исполнитель не открывают хранилище метаданных"
type = "forbidden"
source_modules = [
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.render",
    "autogenerator.worker",
    "autogenerator.plugin_host",
    "autogenerator.readers_std",
    "autogenerator.steps_std",
    "autogenerator.blocks_std",
]
forbidden_modules = ["autogenerator.storage"]

[[tool.importlinter.contracts]]
name = "Хранилища зависят только от контрактов"
type = "forbidden"
source_modules = ["autogenerator.storage"]
forbidden_modules = [
    "autogenerator.plugin_host",
    "autogenerator.readers_std",
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.steps_std",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.blocks_std",
    "autogenerator.render",
    "autogenerator.worker",
    "autogenerator.api",
    "autogenerator.cli",
]

[[tool.importlinter.contracts]]
name = "Контракты ни от кого не зависят"
type = "forbidden"
source_modules = ["autogenerator.contracts"]
forbidden_modules = [
    "autogenerator.storage",
    "autogenerator.plugin_host",
    "autogenerator.readers_std",
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.steps_std",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.blocks_std",
    "autogenerator.render",
    "autogenerator.worker",
    "autogenerator.api",
    "autogenerator.cli",
]

[[tool.importlinter.contracts]]
name = "Реестр плагинов зависит только от контрактов"
type = "forbidden"
source_modules = ["autogenerator.plugin_host"]
forbidden_modules = [
    "autogenerator.readers_std",
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.steps_std",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.blocks_std",
    "autogenerator.render",
    "autogenerator.worker",
    "autogenerator.api",
    "autogenerator.cli",
]

[[tool.importlinter.contracts]]
name = "Слои сборки: cli → api → worker"
type = "layers"
layers = [
    "autogenerator.cli",
    "autogenerator.api",
    "autogenerator.worker",
]

[[tool.importlinter.contracts]]
name = "CLI работает только через фасад api"
type = "forbidden"
# Косвенно (через api → worker) CLI, конечно, доходит до модулей; запрещён прямой импорт.
allow_indirect_imports = true
source_modules = ["autogenerator.cli"]
forbidden_modules = [
    "autogenerator.plugin_host",
    "autogenerator.ingest",
    "autogenerator.schema",
    "autogenerator.history",
    "autogenerator.engine",
    "autogenerator.theme",
    "autogenerator.render",
    "autogenerator.worker",
]
