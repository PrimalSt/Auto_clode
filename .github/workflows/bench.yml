name: Бенчмарк загрузки

# Целевые значения из PRD (раздел 9): CSV 10 млн × 30 — до 2 мин и 2 ГБ памяти, лист Excel
# 1 млн × 30 — до 3 мин и 4 ГБ. Windows-машина GitHub (4 ядра, 16 ГБ) слабее компьютера
# пользователя (32 ГБ), поэтому проверка идёт с запасом.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "packages/readers-std/**"
      - "packages/ingest/**"
      - "packages/storage/**"
      - "packages/worker/src/autogenerator/worker/ingest_job.py"
      - "tools/bench_ingest.py"
      - "tools/make_big_data.py"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: Загрузка 10 млн строк CSV и 1 млн строк Excel (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Состояние Microsoft Defender
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object AMServiceEnabled, RealTimeProtectionEnabled | Format-List
        continue-on-error: true
      - name: Бенчмарк
        env:
          PYTHONUTF8: "1"
        run: uv run python tools/bench_ingest.py --data "${{ runner.temp }}/bench-data" --report bench.md --check
      - name: Отчёт
        if: always()
        shell: bash
        run: test -f bench.md && cat bench.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench.md
          if-no-files-found: ignore
