name: Бенчмарк превью

# Цель из PRD (раздел 9): превью шага — не дольше 2 с (на выборке), точные числа — в фоне.
# История — 5 загрузок по 10 млн строк (50 млн) с повторами ключей между загрузками и вход
# для объединения; проверяется и то, что выборка сохраняет дубликаты и пары ключей.
# Windows-машина GitHub (4 ядра, 16 ГБ) слабее компьютера пользователя (32 ГБ), поэтому
# проверка идёт с запасом.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "packages/engine/**"
      - "packages/steps-std/**"
      - "packages/history/**"
      - "packages/worker/src/autogenerator/worker/run.py"
      - "tools/bench_preview.py"
      - "tools/bench_ingest.py"
      - ".github/workflows/bench-preview.yml"

permissions:
  contents: read

concurrency:
  group: bench-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Превью шагов на истории 50 млн строк (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Состояние Microsoft Defender
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object AMServiceEnabled, RealTimeProtectionEnabled | Format-List
        continue-on-error: true
      - name: Бенчмарк
        env:
          PYTHONUTF8: "1"
        run: uv run python tools/bench_preview.py --data "${{ runner.temp }}/bench-data" --report bench.md --check
      - name: Отчёт
        if: always()
        shell: bash
        run: test -f bench.md && cat bench.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-preview-report
          path: bench.md
          if-no-files-found: ignore
