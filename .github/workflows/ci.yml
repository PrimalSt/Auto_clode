name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Стиль, типы, границы модулей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Границы модулей (import-linter)
        run: uv run lint-imports

  frontend:
    name: Окно (типы API, TypeScript, тесты, сборка)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: npm ci
      - name: Типы API совпадают с сервером
        run: |
          npm run api
          git diff --exit-code -- src/shared/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - name: Сборка
        run: npx vite build

  tests:
    name: Тесты и сквозной запуск (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest
      - name: Плагины
        run: uv run agen modules
      - name: agen run на примерах
        run: uv run agen run examples/sales/scenario.yaml --output-dir out
      - name: Папка данных — источники, загрузки, история, отчёт
        shell: bash
        env:
          AGEN_HOME: ${{ runner.temp }}/agen-home
        run: |
          uv run agen source import examples/sales/sources.yaml
          uv run agen upload add sales_crm examples/sales/data/sales/*.csv
          uv run agen upload add sales_plan examples/sales/data/plan/*.xlsx
          uv run agen history sales_crm
          uv run agen run examples/sales/scenario.yaml --output-dir out-home
      - name: Сохранённый сценарий — шаблон в папке данных, запуск по id, история запусков
        shell: bash
        env:
          AGEN_HOME: ${{ runner.temp }}/agen-home
        run: |
          uv run agen scenario add examples/sales/scenario.yaml --id sales
          uv run agen run sales -o out-saved
          uv run agen runs list
          uv run agen backup create
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: out/*.pptx
          if-no-files-found: error
