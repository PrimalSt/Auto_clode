name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Стиль, типы, границы модулей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Границы модулей (import-linter)
        run: uv run lint-imports

  tests:
    name: Тесты и сквозной запуск (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest
      - name: Плагины
        run: uv run agen modules
      - name: agen run на примерах
        run: uv run agen run examples/sales/scenario.yaml --output-dir out
      - name: Папка данных — источники, загрузки, история, отчёт
        shell: bash
        env:
          AGEN_HOME: ${{ runner.temp }}/agen-home
        run: |
          uv run agen source import examples/sales/sources.yaml
          uv run agen upload add sales_crm examples/sales/data/sales/*.csv
          uv run agen upload add sales_plan examples/sales/data/plan/*.xlsx
          uv run agen history sales_crm
          uv run agen run examples/sales/scenario.yaml --output-dir out-home
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: out/*.pptx
          if-no-files-found: error
